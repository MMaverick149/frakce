<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>SYNDICATE - ADMIN EDITOR</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="logo">SYNDICATE</div>
            <nav>
                <a href="index.html" class="nav-btn">⬅ ZPĚT</a>
                <div class="nav-btn active" style="color: #ff4444;">🛠 EDITOR REŽIM</div>
            </nav>
        </aside>

        <main class="viewport">
            <div id="clock">00:00:00</div>
            
            <h1>LOGISTICKÝ EDITOR</h1>

            <div class="glass-card editor-panel">
                <div class="editor-controls">
                    <select id="st-what"></select>
                    <input type="number" id="st-how" value="1">
                    <button onclick="editStore('add')" class="btn-cyan">+</button>
                    <button onclick="editStore('rem')" class="btn-cyan">-</button>
                </div>
            </div>

            <div id="st-grid" class="inv-grid">
                </div>
        </main>
    </div>

    <script>
        // Synchronizace s tvými obrázky v images/
        let s_data = JSON.parse(localStorage.getItem('syn_s_data')) || { 
            "Flashlight": 0, "Nabojedlouhy": 0, "nabojpistol": 0, 
            "Tlumic": 0, "Velkyzasobnik": 0, "zamerovac": 0, "zlutatrava": 0 
        };

        function renderStore() {
            const grid = document.getElementById('st-grid');
            const sel = document.getElementById('st-what');
            
            grid.innerHTML = Object.entries(s_data).map(([k, v]) => `
                <div class="item-card">
                    <div class="item-img-container">
                        <img src="images/${k}.png" onerror="this.src='images/zlutatrava.png'">
                    </div>
                    <label>${k.toUpperCase()}</label>
                    <span class="item-count">${v}</span>
                </div>`).join('');

            sel.innerHTML = Object.keys(s_data).map(k => `<option value="${k}">${k.toUpperCase()}</option>`).join('');
            localStorage.setItem('syn_s_data', JSON.stringify(s_data));
        }

        function editStore(type) {
            const item = document.getElementById('st-what').value;
            const qty = parseInt(document.getElementById('st-how').value) || 0;
            if(type === 'add') s_data[item] += qty;
            else s_data[item] = Math.max(0, s_data[item] - qty);
            renderStore();
        }

        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        }, 1000);

        renderStore();
    </script>
</body>
</html>
