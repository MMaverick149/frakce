<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>SYNDICATE - ADMIN</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="logo">SYNDICATE</div>
            <nav>
                <a href="index.html" class="nav-btn">⬅ ZPĚT</a>
                <div class="nav-btn admin-status">🛠 EDITOR REŽIM</div>
            </nav>
        </aside>

        <main class="viewport">
            <div id="clock">00:00:00</div>
            <h1>SPRÁVA SKLADU</h1>

            <div class="admin-panel glass-card">
                <select id="st-item">
                    <option value="Flashlight">FLASHLIGHT</option>
                    <option value="Nabojedlouhy">NÁBOJE DLOUHÉ</option>
                    <option value="nabojpistol">NÁBOJE PISTOL</option>
                    <option value="Tlumic">TLUMIČ</option>
                    <option value="Velkyzasobnik">VELKÝ ZÁSOBNÍK</option>
                    <option value="zamerovac">ZAMĚŘOVAČ</option>
                    <option value="zlutatrava">ŽLUTÁ TRÁVA</option>
                </select>
                <input type="number" id="st-amount" value="1" min="1">
                <div class="admin-btns">
                    <button onclick="updateStore('add')" class="btn-cyan">+</button>
                    <button onclick="updateStore('rem')" class="btn-cyan">-</button>
                </div>
            </div>

            <div id="st-grid" class="inv-grid"></div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
