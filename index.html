<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNDICATE | OS</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app">
        <nav class="side-nav">
            <div class="brand">SYNDICATE</div>
            <div class="nav-links">
                <button onclick="showPage('home')" id="nav-home" class="active"><i class="fas fa-terminal"></i> HOME</button>
                <button onclick="showPage('storage')" id="nav-storage"><i class="fas fa-database"></i> SKLAD</button>
                <button onclick="showPage('members')" id="nav-members"><i class="fas fa-users"></i> SLOŽKY</button>
                <button onclick="showPage('admin')" id="nav-admin" class="admin-link"><i class="fas fa-lock"></i> ADMIN</button>
            </div>
        </nav>

        <main class="main-content">
            <section id="page-home" class="page">
                <div class="hero">
                    <h1>SYSTEM ONLINE</h1>
                    <p>Zabezpečené rozhraní pro správu frakce.</p>
                </div>
            </section>

            <section id="page-storage" class="page" style="display:none;">
                <div class="header-row">
                    <h2>SKLADOVÝ MANAŽER</h2>
                    <div class="storage-controls">
                        <input type="text" id="op-name" placeholder="Tvé jméno">
                        <select id="it-name">
                            <option value="zbrane">ZBRANĚ</option>
                            <option value="munice">MUNICE</option>
                            <option value="drogy">DROGY</option>
                        </select>
                        <input type="number" id="it-qty" value="1">
                        <button onclick="editStore('add')" class="btn-g">+</button>
                        <button onclick="editStore('rem')" class="btn-r">-</button>
                    </div>
                </div>
                <div class="inventory-display" id="inv-view"></div>
            </section>

            <section id="page-members" class="page" style="display:none;">
                <h2>EVIDENCE OSOB</h2>
                <div class="members-list" id="mem-view"></div>
            </section>

            <section id="page-admin" class="page" style="display:none;">
                <div id="admin-login" class="login-box">
                    <h3>AUTORIZACE</h3>
                    <input type="password" id="pass" placeholder="PIN">
                    <button onclick="login()">VSTOUPIT</button>
                </div>

                <div id="admin-panel" style="display:none;">
                    <h2>HLAVNÍ ŠTÁB</h2>
                    
                    <div class="admin-section">
                        <div class="control-card">
                            <label>REGISTRACE NOVÉHO AGENTA</label>
                            <div class="input-row">
                                <input type="text" id="new-mem" placeholder="Jméno a příjmení">
                                <button onclick="addMem()">VYTVOŘIT PROFIL</button>
                            </div>
                        </div>
                    </div>

                    <div class="admin-section">
                        <div class="log-card">
                            <div class="log-tabs">
                                <button onclick="viewLog('s')" id="tab-s" class="active">SKLAD</button>
                                <button onclick="viewLog('m')" id="tab-m">AKTIVITA</button>
                            </div>
                            <div class="log-screen" id="log-screen"></div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div id="modal" class="modal">
        <div class="modal-box">
            <div class="modal-head">
                <span id="target-name">DETAIL</span>
                <button onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col">
                        <label>POZICE</label>
                        <input type="text" id="f-rank">
                    </div>
                    <div class="col">
                        <label>KONTAKT</label>
                        <input type="text" id="f-phone">
                    </div>
                </div>
                <label>POZNÁMKY / VYBAVENÍ / HISTORIE</label>
                <textarea id="f-notes"></textarea>
                <div class="modal-foot">
                    <input type="text" id="f-sign" placeholder="Tvůj podpis">
                    <button onclick="saveFolder()">ULOŽIT ZÁZNAM</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
