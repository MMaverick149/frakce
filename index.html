<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>SYNDICATE OS v4.0</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="network-shell">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-box"><i class="fas fa-biohazard"></i></div>
                <div class="logo-text"><span class="brand">SYNDICATE</span></div>
            </div>
            <nav class="side-nav">
                <button onclick="showPage('home')" id="nav-home" class="active"><i class="fas fa-terminal"></i> DASHBOARD</button>
                <button onclick="showPage('members')" id="nav-members"><i class="fas fa-folder-open"></i> SLOŽKY</button>
                <button onclick="showPage('storage')" id="nav-storage"><i class="fas fa-box-open"></i> SKLAD</button>
                <div class="nav-spacer"></div>
                <button onclick="showPage('admin')" id="nav-admin" class="btn-admin-nav"><i class="fas fa-fingerprint"></i> ADMIN</button>
            </nav>
        </aside>

        <main class="main-view">
            <section id="page-home" class="page">
                <div class="welcome-card">
                    <h1>VÍTEJTE V DATABÁZI</h1>
                    <p>Vyberte sekci v levém menu pro pokračování.</p>
                </div>
            </section>

            <section id="page-members" class="page" style="display:none;">
                <div class="header-row">
                    <h2 class="glitch-text">SLOŽKY</h2>
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="m-search" placeholder="VYHLEDAT SUBJEKT..." onkeyup="renderMembers()">
                    </div>
                </div>
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr><th>KÓD</th><th>HODNOST</th><th>JMÉNO</th><th>AKCE</th></tr>
                        </thead>
                        <tbody id="members-list"></tbody>
                    </table>
                </div>
            </section>

            <section id="page-storage" class="page" style="display:none;">
                <div class="storage-controls">
                    <h3>MANIPULACE</h3>
                    <div class="control-row">
                        <input type="text" id="st-who" placeholder="Operátor">
                        <select id="st-what">
                            <option value="zbrane">Zbraně</option>
                            <option value="munice">Munice</option>
                            <option value="kontraband">Kontraband</option>
                            <option value="zlutatrava">Žlutá tráva</option>
                        </select>
                        <input type="number" id="st-how" value="1">
                        <button onclick="editStore('add')" class="btn-green">PŘIDAT</button>
                        <button onclick="editStore('rem')" class="btn-red">ODEBRAT</button>
                    </div>
                </div>
                <div class="storage-grid" id="st-grid"></div>
            </section>

            <section id="page-admin" class="page" style="display:none;">
                <div id="admin-lock" class="auth-card">
                    <i class="fas fa-lock fa-3x"></i>
                    <h2>AUTORIZACE VYŽADOVÁNA</h2>
                    <input type="password" id="admin-pin" placeholder="ZADEJTE PIN">
                    <button onclick="unlockAdmin()">POTVRDIT</button>
                </div>
                <div id="admin-panel" style="display:none;">
                    <div class="action-card">
                        <h3>NOVÝ PROFIL</h3>
                        <input type="text" id="new-mem-name" placeholder="Celé jméno">
                        <input type="text" id="new-mem-rank" placeholder="Pozice">
                        <button onclick="addMem()" class="btn-blue">ZAPROTOKOLOVAT</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div id="dossier-modal" class="modal">
        <div class="dossier-card">
            <div class="d-header">
                <div class="d-user-profile">
                    <div class="d-icon-bg"><i class="fas fa-user-secret"></i></div>
                    <div class="d-title">
                        <h2 id="d-name">Jméno</h2>
                        <span>IDENTIFIED SUBJECT</span>
                    </div>
                </div>
                <button onclick="closeModal()" class="close-btn">&times;</button>
            </div>
            <div class="d-tabs">
                <button class="d-tab active" onclick="switchTab(event, 't-info')">INFO</button>
                <button class="d-tab" onclick="switchTab(event, 't-items')">VYBAVENÍ</button>
                <button class="d-tab" onclick="switchTab(event, 't-notes')">POZNÁMKY</button>
            </div>
            <div class="d-content">
                <div id="t-info" class="tab-pane">
                    <label>POZICE VEDENÍ</label>
                    <input type="text" id="in-rank">
                    <label>KONTAKTNÍ ÚDAJE</label>
                    <input type="text" id="in-phone">
                </div>
                <div id="t-items" class="tab-pane" style="display:none;">
                    <textarea id="in-items" placeholder="Inventář subjektu..." rows="8"></textarea>
                </div>
                <div id="t-notes" class="tab-pane" style="display:none;">
                    <textarea id="in-notes" placeholder="Poznámky..." rows="8"></textarea>
                </div>
            </div>
            <div class="d-footer">
                <input type="text" id="in-sig" placeholder="Autorizoval">
                <button class="btn-blue" onclick="saveFolder()">AKTUALIZOVAT</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
