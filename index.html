<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>SYNDICATE OS v4.0</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-wrapper">
        <aside class="sidebar">
            <div class="brand">
                <i class="fas fa-biohazard"></i>
                <span>SYNDICATE OS</span>
            </div>
            <nav class="nav-menu">
                <button onclick="showPage('home')" id="nav-home" class="active"><i class="fas fa-terminal"></i> DASHBOARD</button>
                <button onclick="showPage('members')" id="nav-members"><i class="fas fa-folder-open"></i> SLOŽKY</button>
                <button onclick="showPage('storage')" id="nav-storage"><i class="fas fa-box-open"></i> SKLAD</button>
            </nav>
            <div class="nav-footer">
                <button onclick="showPage('admin')" id="nav-admin" class="btn-admin-nav"><i class="fas fa-fingerprint"></i> ADMIN</button>
            </div>
        </aside>

        <main class="main-content">
            <section id="page-home" class="page">
                <div class="hero">
                    <h1>VÍTEJTE V DATABÁZI</h1>
                    <p>Terminál je připraven k autorizovaným operacím.</p>
                </div>
            </section>

            <section id="page-members" class="page" style="display:none;">
                <div class="page-header">
                    <h2>SLOŽKY</h2>
                    <div class="search-container">
                        <i class="fas fa-search"></i>
                        <input type="text" id="m-search" placeholder="VYHLEDAT SUBJEKT..." onkeyup="renderMembers()">
                    </div>
                </div>
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr><th>KÓD</th><th>HODNOST</th><th>JMÉNO</th><th>AKCE</th></tr>
                        </thead>
                        <tbody id="members-list"></tbody>
                    </table>
                </div>
            </section>

            <section id="page-storage" class="page" style="display:none;">
                <div class="storage-editor">
                    <h3>LOGISTIKA</h3>
                    <div class="editor-row">
                        <input type="text" id="st-who" placeholder="Operátor">
                        <select id="st-what">
                            <option value="zbrane">Zbraně</option>
                            <option value="munice">Munice</option>
                            <option value="kontraband">Kontraband</option>
                            <option value="zlutatrava">Žlutá tráva</option>
                        </select>
                        <input type="number" id="st-how" value="1">
                        <button onclick="editStore('add')" class="btn-green">PŘIDAT</button>
                        <button onclick="editStore('rem')" class="btn-red">ODEBRAT</button>
                    </div>
                </div>
                <div class="storage-grid" id="st-grid"></div>
            </section>

            <section id="page-admin" class="page" style="display:none;">
                <div id="admin-lock" class="auth-card">
                    <i class="fas fa-lock fa-3x"></i>
                    <h2>RESTRICTED AREA</h2>
                    <input type="password" id="admin-pin" placeholder="ENTER PIN">
                    <button onclick="unlockAdmin()">POTVRDIT</button>
                </div>
                <div id="admin-panel" style="display:none;">
                    <div class="action-card">
                        <h3>NOVÝ PROFIL</h3>
                        <input type="text" id="new-mem-name" placeholder="Jméno">
                        <input type="text" id="new-mem-rank" placeholder="Hodnost">
                        <button onclick="addMem()" class="btn-blue">ZAPSAT</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div id="dossier-modal" class="modal">
        <div class="dossier-card">
            <header class="d-header">
                <div class="d-user-info">
                    <div class="d-avatar-box"><i class="fas fa-user-secret"></i></div>
                    <div class="d-text-box">
                        <h2 id="d-name">Jméno</h2>
                        <span class="d-subtext"><i class="fas fa-shield-alt"></i> IDENTIFIED SUBJECT</span>
                    </div>
                </div>
                <button onclick="closeModal()" class="btn-close-x">&times;</button>
            </header>
            
            <nav class="d-tabs">
                <button class="d-tab active" onclick="switchTab(event, 't-info')">INFO</button>
                <button class="d-tab" onclick="switchTab(event, 't-items')">VYBAVENÍ</button>
                <button class="d-tab" onclick="switchTab(event, 't-notes')">POZNÁMKY</button>
            </nav>

            <div class="d-content">
                <div id="t-info" class="tab-pane active">
                    <div class="d-grid">
                        <div class="d-input-group">
                            <label>HODNOST</label>
                            <input type="text" id="in-rank">
                        </div>
                        <div class="d-input-group">
                            <label>TELEFON</label>
                            <input type="text" id="in-phone">
                        </div>
                    </div>
                </div>
                <div id="t-items" class="tab-pane">
                    <label class="d-label">INVENTÁŘ SUBJEKTU</label>
                    <textarea id="in-items" rows="6"></textarea>
                </div>
                <div id="t-notes" class="tab-pane">
                    <label class="d-label">INTERNÍ ZÁZNAMY</label>
                    <textarea id="in-notes" rows="6"></textarea>
                </div>
            </div>

            <footer class="d-footer">
                <div class="d-auth">
                    <label>AUTORIZOVAL</label>
                    <input type="text" id="in-sig" placeholder="Operátor...">
                </div>
                <button class="btn-update" onclick="saveFolder()">AKTUALIZOVAT</button>
            </footer>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
