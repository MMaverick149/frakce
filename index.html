<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>SYNDICATE OS v7.0</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="logo"><i class="fas fa-terminal"></i> SYNDICATE</div>
            <nav class="main-nav">
                <button onclick="showPage('home')" id="nav-home" class="nav-btn active"><i class="fas fa-home"></i> KONZOLE</button>
                <button onclick="showPage('members')" id="nav-members" class="nav-btn"><i class="fas fa-users"></i> DATABÁZE</button>
                <button onclick="showPage('storage')" id="nav-storage" class="nav-btn"><i class="fas fa-box"></i> LOGISTIKA</button>
            </nav>
            <button onclick="showPage('admin')" id="nav-admin" class="admin-btn-bottom"><i class="fas fa-lock"></i> ADMIN</button>
        </aside>

        <main class="viewport">
            <header class="status-bar">
                <div class="sys">SYSTEM: <span class="cyan-glow">ONLINE</span></div>
                <div id="clock">00:00:00</div>
            </header>

            <section id="page-home" class="page active">
                <div class="hero">
                    <h1>MAIN TERMINAL</h1>
                    <p>Všechny systémy pod dohledem operátora. Protokoly v7.0 aktivní.</p>
                </div>
            </section>

            <section id="page-members" class="page">
                <div class="section-head">
                    <h2>EVIDOVANÁ DATA</h2>
                    <input type="text" id="m-search" placeholder="VYHLEDAT..." onkeyup="renderMembers()">
                </div>
                <div class="db-table">
                    <div class="table-row head">
                        <div>KÓD</div><div>HODNOST</div><div>SUBJEKT</div><div>AKCE</div>
                    </div>
                    <div id="members-list"></div>
                </div>
            </section>

            <section id="page-storage" class="page">
                <div class="log-controls">
                    <input type="text" id="st-who" placeholder="OPERÁTOR">
                    <select id="st-what"></select>
                    <input type="number" id="st-how" value="1">
                    <div class="btn-group">
                        <button onclick="editStore('add')" class="btn-add">+</button>
                        <button onclick="editStore('rem')" class="btn-rem">-</button>
                    </div>
                </div>
                <div id="st-grid" class="inv-grid"></div>
            </section>

            <section id="page-admin" class="page">
                <div id="admin-lock" class="glass-card">
                    <i class="fas fa-fingerprint" style="font-size: 3rem; color: #ff4444;"></i>
                    <h3>AUTENTIZACE VYŽADOVÁNA</h3>
                    <input type="password" id="admin-pin" placeholder="PIN KÓD">
                    <button onclick="unlockAdmin()" class="btn-red">VSTOUPIT</button>
                </div>
                <div id="admin-panel" style="display:none;" class="glass-card">
                    <h3>PŘIDAT NOVÝ SUBJEKT</h3>
                    <input type="text" id="new-mem-name" placeholder="Celé jméno">
                    <input type="text" id="new-mem-rank" placeholder="Hodnost">
                    <button onclick="addMem()" class="btn-cyan">ZAPSAT DO DATABÁZE</button>
                </div>
            </section>
        </main>
    </div>

    <div id="dossier-modal" class="overlay">
        <div class="modal-card">
            <div class="modal-sidebar">
                <div class="avatar"><i class="fas fa-user-ninja"></i></div>
                <div id="d-id-code" class="id-tag">#0000</div>
            </div>
            <div class="modal-main">
                <header>
                    <h2 id="d-name">Jméno</h2>
                    <button onclick="closeModal()" class="close-btn">&times;</button>
                </header>
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab(event, 't-info')">INFO</button>
                    <button class="tab-btn" onclick="switchTab(event, 't-items')">VÝBAVA</button>
                    <button class="tab-btn" onclick="switchTab(event, 't-notes')">POZNÁMKY</button>
                </div>
                <div class="tab-body">
                    <div id="t-info" class="pane active">
                        <label>HODNOST</label><input type="text" id="in-rank">
                        <label>TELEFON</label><input type="text" id="in-phone">
                    </div>
                    <div id="t-items" class="pane">
                        <label>INVENTÁŘ</label><textarea id="in-items"></textarea>
                    </div>
                    <div id="t-notes" class="pane">
                        <label>ZÁZNAMY</label><textarea id="in-notes"></textarea>
                    </div>
                </div>
                <footer>
                    <button onclick="saveFolder()" class="btn-update">AKTUALIZOVAT</button>
                </footer>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
