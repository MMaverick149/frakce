<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>SYNDICATE - TERMINÁL</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="logo">SYNDICATE</div>
            <nav>
                <button class="nav-btn active">TERMINÁL</button>
                <button class="nav-btn">DATABÁZE</button>
                <a href="sklad.html" class="nav-btn">SKLAD</a>
                <div class="status-tag">SYSTÉM ONLINE</div>
            </nav>
        </aside>

        <main class="viewport terminal-bg">
            <div id="clock">00:00:00</div>
            <h1>SYSTEM OVERVIEW</h1>
            
            <div class="terminal-grid">
                <div class="glass-card status-panel">
                    <div class="panel-header">NETWORK STATUS</div>
                    <p>> Šifrování: AES-256 AKTIVNÍ</p>
                    <p>> Umístění: [REDACTED]</p>
                    <p>> Připojení: ZABEZPEČENO</p>
                </div>
                
                <div class="glass-card activity-panel">
                    <div class="panel-header">RECENT ACTIVITY</div>
                    <div id="log-entries">
                        <p class="log-info">[18:42] Přístup do skladu autorizován</p>
                        <p class="log-warn">[19:15] Aktualizace zásob: Munice +50</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
