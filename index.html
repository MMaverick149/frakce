<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>SYNDICATE - TERMINÁL</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="logo">SYNDICATE</div>
            <nav>
                <a href="index.html" class="nav-btn active">TERMINÁL</a>
                <a href="sklad.html" class="nav-btn">SKLAD</a>
                <button onclick="accessAdmin()" class="nav-btn admin-btn">🔒 ADMIN</button>
            </nav>
        </aside>

        <main class="viewport">
            <div id="clock">00:00:00</div>
            <h1 class="glitch-text">SYSTEM ONLINE</h1>
            <div class="glass-card terminal-status">
                <p>> NETWORK: <span class="cyan">ŠIFROVÁNÍ AKTIVNÍ</span></p>
                <p>> STATUS: <span class="cyan">ZABEZPEČENO</span></p>
                <div class="separator"></div>
                <p class="low-opacity">Vítejte v komunikačním uzlu. Veškerá aktivita je logována v reálném čase.</p>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
