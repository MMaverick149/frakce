<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>MDT | SYNDICATE DATABASE</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="mdt-app">
        <aside class="mdt-sidebar">
            <div class="mdt-brand">
                <div class="badge">S</div>
                <span>SYNDICATE <strong>MDT</strong></span>
            </div>
            <nav class="mdt-nav">
                <button onclick="showPage('home')" id="nav-home" class="active"><i class="fas fa-home"></i> Dashboard</button>
                <button onclick="showPage('members')" id="nav-members"><i class="fas fa-user-friends"></i> Registr občanů</button>
                <button onclick="showPage('storage')" id="nav-storage"><i class="fas fa-box"></i> Skladové zásoby</button>
                <button onclick="showPage('admin')" id="nav-admin" class="btn-admin"><i class="fas fa-shield-alt"></i> Administrace</button>
            </nav>
        </aside>

        <main class="mdt-content">
            <section id="page-home" class="page">
                <div class="glass-card welcome">
                    <h1>Vítejte, Operátore</h1>
                    <p>Systém je připraven k evidenci a správě dat.</p>
                </div>
            </section>

            <section id="page-members" class="page" style="display:none;">
                <div class="page-header">
                    <h2>Registr osob</h2>
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="m-search" placeholder="Vyhledat jméno..." onkeyup="renderMembers()">
                    </div>
                </div>
                <div class="glass-card no-padding">
                    <table class="mdt-table">
                        <thead>
                            <tr>
                                <th># ID</th>
                                <th>Jméno a příjmení</th>
                                <th>Stav</th>
                                <th>Akce</th>
                            </tr>
                        </thead>
                        <tbody id="members-list"></tbody>
                    </table>
                </div>
            </section>

            <section id="page-storage" class="page" style="display:none;">
                <div class="storage-container">
                    <div class="glass-card storage-form">
                        <h3>Manipulace se skladem</h3>
                        <div class="form-group">
                            <input type="text" id="st-who" placeholder="Jméno pracovníka">
                            <select id="st-what">
                                <option value="zbrane">Zbraně</option>
                                <option value="munice">Munice</option>
                                <option value="drogy">Léčiva</option>
                            </select>
                            <input type="number" id="st-how" value="1">
                        </div>
                        <div class="btn-group">
                            <button onclick="editStore('add')" class="btn-p"><i class="fas fa-plus"></i> Přidat</button>
                            <button onclick="editStore('rem')" class="btn-m"><i class="fas fa-minus"></i> Odebrat</button>
                        </div>
                    </div>
                    <div class="storage-grid" id="st-grid"></div>
                </div>
            </section>

            <section id="page-admin" class="page" style="display:none;">
                <div id="admin-lock" class="glass-card auth">
                    <i class="fas fa-key"></i>
                    <input type="password" id="admin-pin" placeholder="Zadejte PIN">
                    <button onclick="loginAdmin()">Vstoupit</button>
                </div>
                <div id="admin-ui" style="display:none;">
                    <div class="admin-top">
                        <div class="glass-card">
                            <h3>Vytvořit nový profil</h3>
                            <input type="text" id="new-mem-name" placeholder="Celé jméno">
                            <button onclick="addMem()" class="btn-p">Registrovat</button>
                        </div>
                    </div>
                    <div class="glass-card logs">
                        <h3>Systémové záznamy</h3>
                        <div id="log-list"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div id="dossier-modal" class="modal">
        <div class="dossier-glass">
            <div class="d-header">
                <div class="d-profile">
                    <div class="d-avatar"><i class="fas fa-user-tie"></i></div>
                    <div>
                        <h2 id="d-name">David Ricci</h2>
                        <span class="d-tag">OBČAN #2299</span>
                    </div>
                </div>
                <button onclick="closeModal()" class="close-btn">&times;</button>
            </div>
            <div class="d-tabs">
                <button class="t-btn active" onclick="tab(event, 't-info')">Profil</button>
                <button class="t-btn" onclick="tab(event, 't-lic')">Licence</button>
                <button class="t-btn" onclick="tab(event, 't-rec')">Záznamy</button>
            </div>
            <div class="d-body">
                <div id="t-info" class="tab-content">
                    <div class="d-grid">
                        <div class="d-field"><label>Rank</label><input type="text" id="in-rank"></div>
                        <div class="d-field"><label>Telefon</label><input type="text" id="in-phone"></div>
                    </div>
                </div>
                <div id="t-lic" class="tab-content" style="display:none;">
                    <textarea id="in-lic" placeholder="Seznam licencí..."></textarea>
                </div>
                <div id="t-rec" class="tab-content" style="display:none;">
                    <textarea id="in-rec" placeholder="Trestní záznamy a poznámky..."></textarea>
                </div>
            </div>
            <div class="d-footer">
                <input type="text" id="in-sig" placeholder="Podpis operátora">
                <button onclick="saveFolder()">Uložit do databáze</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
