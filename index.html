<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>SYNDICATE OS v7.0</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="logo">SYNDICATE</div>
            <nav>
                <button onclick="showPage('home')" class="nav-btn">KONZOLE</button>
                <button onclick="showPage('members')" class="nav-btn">DATABÁZE</button>
                <button onclick="showPage('storage')" class="nav-btn">LOGISTIKA</button>
                <a href="sklad.html" class="nav-btn" style="text-decoration:none; color:#ff4444;">⚙ EDITOR SKLADU</a>
            </nav>
        </aside>

        <main class="viewport">
            <div id="clock">00:00:00</div>
            
            <section id="page-home" class="page active">
                <h1>MAIN TERMINAL</h1>
                <p>Všechny systémy pod dohledem operátora. Protokoly v7.0 aktivní.</p>
            </section>

            <section id="page-members" class="page">
                <h2>EVIDOVANÁ DATA</h2>
                <div class="table-header">
                    <div>KÓD</div><div>HODNOST</div><div>SUBJEKT</div><div>AKCE</div>
                </div>
                <div id="members-list"></div>
            </section>

            <section id="page-storage" class="page">
                <h2>LOGISTIKA - PŘEHLED</h2>
                <div id="st-grid" class="inv-grid"></div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
