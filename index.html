<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>SYNDICATE | NETWORK</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="network-shell">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-box"><i class="fas fa-biohazard"></i></div>
                <div class="logo-text">
                    <span class="brand">SYNDICATE</span>
                    <span class="sub">Deep Net Access</span>
                </div>
            </div>
            <nav class="side-nav">
                <button onclick="showPage('home')" id="nav-home" class="active"><i class="fas fa-terminal"></i> Terminal</button>
                <button onclick="showPage('members')" id="nav-members"><i class="fas fa-user-secret"></i> Evidence osob</button>
                <button onclick="showPage('storage')" id="nav-storage"><i class="fas fa-box-open"></i> Černý trh</button>
                <button onclick="showPage('admin')" id="nav-admin" class="admin-btn"><i class="fas fa-fingerprint"></i> Root Access</button>
            </nav>
        </aside>

        <main class="main-view">
            <header class="top-header">
                <div class="path">Network > <span id="current-path">Terminal</span></div>
                <div class="user-status">Status: <span class="online">Encrypted Connection</span></div>
            </header>

            <section id="page-home" class="page">
                <div class="welcome-card">
                    <h1>SYNDICATE DATABASE</h1>
                    <p>Vítejte v interním systému. Veškerá aktivita je šifrována.</p>
                </div>
            </section>

            <section id="page-members" class="page" style="display:none;">
                <div class="page-top-row">
                    <h2>Registr osob</h2>
                    <div class="search-wrap">
                        <i class="fas fa-search"></i>
                        <input type="text" id="m-search" placeholder="Hledat alias..." onkeyup="renderMembers()">
                    </div>
                </div>
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Kód</th>
                                <th>Jméno / Alias</th>
                                <th>Status</th>
                                <th style="text-align:right">Akce</th>
                            </tr>
                        </thead>
                        <tbody id="members-list"></tbody>
                    </table>
                </div>
            </section>

            <section id="page-storage" class="page" style="display:none;">
                <div class="storage-layout">
                    <div class="action-card">
                        <h3>LOGISTIKA</h3>
                        <div class="form-body">
                            <input type="text" id="st-who" placeholder="Operátor">
                            <select id="st-what">
                                <option value="zbrane">Zbraně</option>
                                <option value="munice">Munice</option>
                                <option value="drogy">Kontraband</option>
                            </select>
                            <input type="number" id="st-how" value="1">
                            <div class="btn-row">
                                <button onclick="editStore('add')" class="btn-green">PŘÍJEM</button>
                                <button onclick="editStore('rem')" class="btn-red">VÝDEJ</button>
                            </div>
                        </div>
                    </div>
                    <div class="storage-grid" id="st-grid"></div>
                </div>
            </section>

            <section id="page-admin" class="page" style="display:none;">
                <div id="admin-auth" class="auth-box">
                    <i class="fas fa-key"></i>
                    <h3>AUTORIZACE</h3>
                    <input type="password" id="admin-pin" placeholder="PIN">
                    <button onclick="loginAdmin()">DECRYPT</button>
                </div>
                <div id="admin-panel" style="display:none;">
                    <div class="admin-grid">
                        <div class="action-card">
                            <h3>NOVÝ PROFIL</h3>
                            <input type="text" id="new-mem-name" placeholder="Celé jméno / Alias">
                            <button onclick="addMem()" class="btn-blue">VYTVOŘIT</button>
                        </div>
                        <div class="action-card log-card">
                            <h3>LOGY</h3>
                            <div id="log-list" class="log-output"></div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div id="dossier-modal" class="modal">
        <div class="dossier-card">
            <div class="d-head">
                <div class="d-user">
                    <div class="d-avatar"><i class="fas fa-user-ninja"></i></div>
                    <div>
                        <h2 id="d-name">David Ricci</h2>
                        <span class="d-id">SUBJECT #<span id="d-id-val">7820</span></span>
                    </div>
                </div>
                <button onclick="closeModal()" class="close-x">&times;</button>
            </div>
            <div class="d-tabs">
                <button class="t-btn active" onclick="switchTab(event, 't-info')">INFO</button>
                <button class="t-btn" onclick="switchTab(event, 't-items')">VYBAVENÍ</button>
                <button class="t-btn" onclick="switchTab(event, 't-notes')">ZÁZNAMY</button>
            </div>
            <div class="d-body">
                <div id="t-info" class="tab-pane">
                    <div class="d-grid">
                        <div class="fld"><label>POZICE</label><input type="text" id="in-rank"></div>
                        <div class="fld"><label>KONTAKT</label><input type="text" id="in-phone"></div>
                    </div>
                </div>
                <div id="t-items" class="tab-pane" style="display:none;">
                    <textarea id="in-items" placeholder="Vydané zbraně, klíče, majetek..."></textarea>
                </div>
                <div id="t-notes" class="tab-pane" style="display:none;">
                    <textarea id="in-notes" placeholder="Historie akcí, varování, poznámky..."></textarea>
                </div>
            </div>
            <div class="d-foot">
                <input type="text" id="in-sig" placeholder="Podpis">
                <button onclick="saveFolder()">ULOŽIT ZMĚNY</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
