<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>SYNDICATE OS v4.0</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="wrapper">
        <aside class="sidebar">
            <div class="brand-zone">
                <i class="fas fa-biohazard"></i>
                <span>SYNDICATE OS</span>
            </div>
            <nav class="nav-links">
                <button onclick="showPage('home')" id="nav-home" class="active"><i class="fas fa-terminal"></i> DASHBOARD</button>
                <button onclick="showPage('members')" id="nav-members"><i class="fas fa-folder-open"></i> SLOŽKY</button>
                <button onclick="showPage('storage')" id="nav-storage"><i class="fas fa-box-open"></i> SKLAD</button>
            </nav>
            <div class="nav-bottom">
                <button onclick="showPage('admin')" id="nav-admin" class="btn-admin"><i class="fas fa-user-shield"></i> ADMIN</button>
            </div>
        </aside>

        <main class="viewport">
            <section id="page-home" class="page-content">
                <h1>VÍTEJTE V DATABÁZI</h1>
                <p>Systém je připraven k operacím.</p>
            </section>

            <section id="page-members" class="page-content" style="display:none;">
                <div class="header-flex">
                    <h2>SLOŽKY</h2>
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="m-search" placeholder="VYHLEDAT..." onkeyup="renderMembers()">
                    </div>
                </div>
                <div class="table-wrap">
                    <table class="syndicate-table">
                        <thead>
                            <tr><th>KÓD</th><th>HODNOST</th><th>JMÉNO</th><th>AKCE</th></tr>
                        </thead>
                        <tbody id="members-list"></tbody>
                    </table>
                </div>
            </section>

            <section id="page-storage" class="page-content" style="display:none;">
                <div class="storage-actions">
                    <h3>MANIPULACE</h3>
                    <div class="inputs">
                        <input type="text" id="st-who" placeholder="Jméno">
                        <select id="st-what">
                            <option value="zbrane">Zbraně</option>
                            <option value="munice">Munice</option>
                            <option value="kontraband">Kontraband</option>
                            <option value="zlutatrava">Žlutá tráva</option>
                        </select>
                        <input type="number" id="st-how" value="1">
                        <button onclick="editStore('add')" class="btn-g">PŘIDAT</button>
                        <button onclick="editStore('rem')" class="btn-r">ODEBRAT</button>
                    </div>
                </div>
                <div class="storage-grid" id="st-grid"></div>
            </section>

            <section id="page-admin" class="page-content" style="display:none;">
                <div id="admin-lock" class="auth-box">
                    <i class="fas fa-lock fa-3x"></i>
                    <h2>PŘÍSTUP OMEZEN</h2>
                    <input type="password" id="admin-pin" placeholder="PIN">
                    <button onclick="unlockAdmin()">POTVRDIT</button>
                </div>
                <div id="admin-panel" style="display:none;">
                    <div class="admin-card">
                        <h3>VYTVOŘIT PROFIL</h3>
                        <input type="text" id="new-n" placeholder="Celé jméno">
                        <input type="text" id="new-r" placeholder="Hodnost">
                        <button onclick="addMem()" class="btn-b">ZAPSAT</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div id="dossier-modal" class="modal">
        <div class="dossier-window">
            <header class="d-head">
                <div class="d-profile">
                    <div class="d-avatar"><i class="fas fa-user-secret"></i></div>
                    <div class="d-title"><h2 id="d-name">Jméno</h2><span>SUBJECT IDENTIFIED</span></div>
                </div>
                <button onclick="closeModal()" class="d-close">&times;</button>
            </header>
            <div class="d-tabs">
                <button class="t-btn active" onclick="switchTab(event, 't-info')">INFO</button>
                <button class="t-btn" onclick="switchTab(event, 't-items')">VYBAVENÍ</button>
                <button class="t-btn" onclick="switchTab(event, 't-notes')">POZNÁMKY</button>
            </div>
            <div class="d-body">
                <div id="t-info" class="tab-p">
                    <label>HODNOST</label><input type="text" id="in-rank">
                    <label>TELEFON</label><input type="text" id="in-phone">
                </div>
                <div id="t-items" class="tab-p" style="display:none;">
                    <textarea id="in-items" placeholder="Inventář..."></textarea>
                </div>
                <div id="t-notes" class="tab-p" style="display:none;">
                    <textarea id="in-notes" placeholder="Poznámky..."></textarea>
                </div>
            </div>
            <footer class="d-foot">
                <button onclick="saveFolder()" class="btn-b">AKTUALIZOVAT</button>
            </footer>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
