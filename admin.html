<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="logo">SYNDICATE</div>
            <nav><a href="sklad.html" class="nav-btn">ZPĚT DO SKLADU</a></nav>
        </aside>
        <main class="viewport">
            <h1>ADMINISTRAČNÍ KONZOLE</h1>
            <div style="display: flex; gap: 20px;">
                <div class="glass-card" style="flex: 1;">
                    <h3>MANIPULACE</h3>
                    <input type="text" id="operator-name" placeholder="Jméno operátora" class="admin-input">
                    <select id="folder-select" class="admin-input"></select>
                    <input type="number" id="item-amount" value="1" class="admin-input">
                    <div style="display: flex; gap: 10px;">
                        <button onclick="modifyStock('add')" class="btn-cyan">PŘIDAT +</button>
                        <button onclick="modifyStock('rem')" class="btn-cyan" style="background:#ff4444; color:white;">ODEBRAT -</button>
                    </div>
                </div>
                <div class="glass-card" style="flex: 1;">
                    <h3>HISTORIE</h3>
                    <div id="admin-logs" style="height: 300px; overflow-y: auto; color: #0ff; font-family: monospace;"></div>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
