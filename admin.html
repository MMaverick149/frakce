<main class="viewport">
    <h1>ADMIN PANEL</h1>
    <div class="admin-grid">
        <!-- Ovládání -->
        <div class="glass-card admin-box">
            <h3>MANIPULACE SE ZBOŽÍM</h3>
            <div class="editor-ui">
                <select id="folder-select"></select>
                <input type="number" id="item-amount" value="1">
                <button onclick="modifyStock('add')" class="btn-cyan">PŘIDAT +</button>
                <button onclick="modifyStock('rem')" class="btn-cyan btn-rem">ODEBRAT -</button>
            </div>
        </div>

        <!-- TADY JE TO LOGOVÁNÍ -->
        <div class="glass-card admin-box">
            <h3>HISTORIE OPERACÍ</h3>
            <div id="admin-logs" class="log-container">
                <!-- Sem se zapisují změny -->
            </div>
        </div>
    </div>
</main>
<script src="script.js"></script>
