<main class="viewport">
    <h1>ADMIN PANEL</h1>
    <div class="admin-grid" style="display: flex; gap: 20px;">
        
        <!-- MANIPULACE -->
        <div class="glass-card" style="flex: 1;">
            <h3>MANIPULACE SE ZBOŽÍM</h3>
            <div class="editor-ui">
                <label>JMÉNO OPERÁTORA:</label>
                <input type="text" id="operator-name" placeholder="Tvé jméno..." class="admin-input">
                
                <label>POLOŽKA:</label>
                <select id="folder-select" class="admin-input"></select>
                
                <label>MNOŽSTVÍ:</label>
                <input type="number" id="item-amount" value="1" class="admin-input">
                
                <div style="margin-top: 10px;">
                    <button onclick="modifyStock('add')" class="btn-cyan">PŘIDAT +</button>
                    <button onclick="modifyStock('rem')" class="btn-cyan btn-rem">ODEBRAT -</button>
                </div>
            </div>
        </div>

        <!-- LOGOVÁNÍ -->
        <div class="glass-card" style="flex: 1;">
            <h3>HISTORIE OPERACÍ</h3>
            <div id="admin-logs" class="log-container" style="max-height: 400px; overflow-y: auto; color: #0ff; font-family: monospace;">
                <!-- Zde se zobrazí: [Čas] Jméno PŘIDAL: 5ks -> MUNICE -->
            </div>
        </div>

    </div>
</main>
<script src="script.js"></script>
