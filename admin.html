<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>SYNDICATE - ADMIN</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="logo">SYNDICATE</div>
            <nav><a href="sklad.html" class="nav-btn">ZPĚT DO SKLADU</a></nav>
        </aside>
        <main class="viewport">
            <h1>ADMIN PANEL</h1>
            <div style="display: flex; gap: 20px;">
                <!-- OVLÁDÁNÍ -->
                <div class="glass-card" style="flex: 1; padding: 20px;">
                    <h3>MANIPULACE</h3>
                    <input type="text" id="operator-name" placeholder="Tvé jméno..." class="admin-input" style="width: 100%; margin-bottom: 10px;">
                    <select id="folder-select" class="admin-input" style="width: 100%; margin-bottom: 10px;"></select>
                    <input type="number" id="item-amount" value="1" class="admin-input" style="width: 100%; margin-bottom: 10px;">
                    <div style="display: flex; gap: 10px;">
                        <button onclick="modifyStock('add')" class="btn-cyan">PŘIDAT +</button>
                        <button onclick="modifyStock('rem')" class="btn-cyan btn-rem">ODEBRAT -</button>
                    </div>
                </div>
                <!-- HISTORIE (Logování) -->
                <div class="glass-card" style="flex: 1; padding: 20px;">
                    <h3>HISTORIE OPERACÍ</h3>
                    <div id="admin-logs" style="max-height: 400px; overflow-y: auto; font-family: monospace; color: #0ff;"></div>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
